plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minimal.launcher'
    compileSdk 37

    defaultConfig {
        applicationId "com.minimal.launcher"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // ObsoleteSdkInt sugere fundir mipmap-anydpi-v26 em mipmap-anydpi, mas o
        // AAPT2 não resolve o recurso sem o qualificador de versão e o build quebra.
        // NotifyDataSetChanged é dica genérica: aqui as listas têm poucas dezenas
        // de itens e são recarregadas uma vez por gesto, não em scroll.
        disable 'ObsoleteSdkInt', 'NotifyDataSetChanged'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.19.1'

    // Shizuku: o X tenta encerrar o app por baixo. O provider e o que adquire o
    // binder; a api sozinha nao conecta.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // RecentRanker e a unica regra da tela de recentes que falha em silencio:
    // um >= trocado por > esvazia a lista sem deixar rastro em log nenhum.
    testImplementation 'junit:junit:4.13.2'
}
